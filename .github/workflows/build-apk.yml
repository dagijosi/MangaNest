name: Build MangaNest Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate and Package APK
        run: |
          mkdir -p build_output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE"
            cp "$APK_FILE" build_output/MangaNest.apk
          else
            echo "No APK found!" && exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaNest-APK
          path: build_output/MangaNest.apk
          retention-days: 2

      - name: Clean Old Workflow Artifacts (Keep Only Latest 2)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const apkArtifacts = res.data.artifacts.filter(a => a.name === 'MangaNest-APK');
              if (apkArtifacts.length > 2) {
                const toDelete = apkArtifacts.slice(2);
                for (const artifact of toDelete) {
                  console.log(`Deleting old artifact: ${artifact.id}`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                }
              }
            } catch (err) {
              console.log('Artifact cleanup skipped or failed:', err);
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'MangaNest v1.0.0' }}
          files: build_output/MangaNest.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Old GitHub Releases (Keep Only Latest 2 Releases)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (releases.data.length > 2) {
                const oldReleases = releases.data.slice(2);
                for (const rel of oldReleases) {
                  console.log(`Deleting old release: ${rel.tag_name} (id: ${rel.id})`);
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: rel.id,
                  });
                }
              }
            } catch (err) {
              console.log('Release cleanup skipped or failed:', err);
            }
